      - name: Fix V23 account buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(r"$PROJECT_DIR/app/src/main/assets/catalog/online.js")
          s = p.read_text(encoding="utf-8")

          start = s.index("async function signup()")
          end = s.index("function logout()", start)

          replacement = '''async function signup(){
            const btn=document.querySelector('button[onclick="signup()"]');
            const originalText=btn?btn.textContent:"إنشاء الحساب";
            try{
              if(btn){
                btn.disabled=true;
                btn.textContent="جاري إنشاء الحساب...";
                btn.style.opacity="0.65";
              }
              const f={
                full_name:document.getElementById("sn").value.trim(),
                phone:document.getElementById("sp").value.trim(),
                shop_name:document.getElementById("ss").value.trim(),
                city:document.getElementById("sc").value.trim(),
                email:document.getElementById("se").value.trim(),
                password:document.getElementById("sw").value
              };
              if(!f.full_name||!f.email||f.password.length<6){
                return alert("أكمل البيانات وكلمة المرور 6 أحرف على الأقل.");
              }
              const d=await api("/auth/v1/signup",{
                method:"POST",
                body:JSON.stringify({email:f.email,password:f.password})
              });
              if(!d.access_token){
                return alert("تم إنشاء الحساب. إذا طُلب تأكيد البريد، افتح رسالة التأكيد ثم سجّل الدخول.");
              }
              token=d.access_token;
              user=d.user;
              localStorage.setItem("habashy_token",token);
              localStorage.setItem("habashy_user",JSON.stringify(user));
              await api("/rest/v1/customer_profiles",{
                method:"POST",
                headers:{"Prefer":"resolution=merge-duplicates"},
                body:JSON.stringify({
                  id:user.id,
                  full_name:f.full_name,
                  phone:f.phone||null,
                  shop_name:f.shop_name||null,
                  city:f.city||null,
                  last_seen_at:new Date().toISOString()
                })
              });
              await track("signup");
              await checkAdmin();
              home();
            }catch(e){
              alert("تعذر إنشاء الحساب: "+e.message);
            }finally{
              if(btn){
                btn.disabled=false;
                btn.textContent=originalText;
                btn.style.opacity="1";
              }
            }
          }

          async function login(){
            try{
              const email=document.getElementById("le").value.trim();
              const password=document.getElementById("lw").value;
              const d=await api("/auth/v1/token?grant_type=password",{
                method:"POST",
                body:JSON.stringify({email,password})
              });
              token=d.access_token;
              user=d.user;
              localStorage.setItem("habashy_token",token);
              localStorage.setItem("habashy_user",JSON.stringify(user));
              await checkAdmin();
              await track("login");
              home();
            }catch(e){
              alert("تعذر تسجيل الدخول: "+e.message);
            }
          }

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          PY
