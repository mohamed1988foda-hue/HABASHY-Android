name: Build HABASHY APK V24
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q HABASHY_Android_Project_V18.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable Internet
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\ <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Install V23 web app
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/catalog"
          python3 -c "from pathlib import Path; p=Path(r'$PROJECT_DIR/app/src/main/assets/catalog/index.html'); s=p.read_text(encoding='utf-8'); s=s if 'src=\"online.js\"' in s else s.replace('</body>','<script src=\"online.js\"></script></body>'); p.write_text(s,encoding='utf-8')"
          echo  | base64 -d > "$PROJECT_DIR/app/src/main/assets/catalog/online.js"


      - name: Fix account loading state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/assets/catalog/online.js"
          s = p.read_text(encoding="utf-8")
          marker = "async function signup(){"
          if marker in s:
              start = s.index(marker)
              end = s.index("function logout()", start)
              replacement = """async function signup(){ const btn=document.querySelector('button[onclick="signup()"]'); const originalText=btn?btn.textContent:"إنشاء الحساب"; try{ if(btn){ btn.disabled=true; btn.textContent="جاري إنشاء الحساب..."; btn.style.opacity="0.65"; } const f={ full_name:document.getElementById("sn").value.trim(), phone:document.getElementById("sp").value.trim(), shop_name:document.getElementById("ss").value.trim(), city:document.getElementById("sc").value.trim(), email:document.getElementById("se").value.trim(), password:document.getElementById("sw").value }; if(!f.full_name||!f.email||f.password.length<6){ return alert("أكمل البيانات وكلمة المرور 6 أحرف على الأقل."); } const d=await api("/auth/v1/signup",{ method:"POST", body:JSON.stringify({email:f.email,password:f.password}) }); if(!d.access_token){ return alert("تم إنشاء الحساب. إذا طُلب تأكيد البريد، افتح رسالة التأكيد ثم سجّل الدخول."); } token=d.access_token; user=d.user; localStorage.setItem("habashy_token",token); localStorage.setItem("habashy_user",JSON.stringify(user)); await api("/rest/v1/customer_profiles",{ method:"POST", headers:{"Prefer":"resolution=merge-duplicates"}, body:JSON.stringify({ id:user.id, full_name:f.full_name, phone:f.phone||null, shop_name:f.shop_name||null, city:f.city||null, last_seen_at:new Date().toISOString() }) }); await track("signup"); await checkAdmin(); home(); }catch(e){ alert("تعذر إنشاء الحساب: "+e.message); }finally{ if(btn){ btn.disabled=false; btn.textContent=originalText; btn.style.opacity="1"; } } } """
              s = s[:start] + replacement + s[end:]
              p.write_text(s, encoding="utf-8")
          PY

      - name: Update MainActivity
        run: |
          echo  | base64 -d > "$PROJECT_DIR/app/src/main/java/com/habashy/catalog/MainActivity.java"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HABASHY-APK-V24
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
