name: Build HABASHY APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q HABASHY_Android_Project_V19.zip -d extracted

      - name: Locate project
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix Java source
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/habashy/catalog/MainActivity.java"
          sed -i ':a;N;$!ba;s/تطبيق الحبشي HABASHY – فرع أبـيـس\nكتالوج ومنتجات وطلبات/تطبيق الحبشي HABASHY – فرع أبـيـس\\\\nكتالوج ومنتجات وطلبات/' "$FILE"
      - name: Remove share app section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["PROJECT_DIR"])
          f = root / "app/src/main/java/com/habashy/catalog/MainActivity.java"
          s = f.read_text(encoding="utf-8")
          original = s

          lines = s.splitlines(True)
          out = []

          for line in lines:
              if "مشاركة التطبيق" in line and ".setText(" in line:
                  m = re.search(r'([A-Za-z_$][\w$]*)\.setText\(', line)
                  out.append(line)
                  if m:
                      indent = re.match(r'\s*', line).group(0)
                      out.append(
                          indent + m.group(1) +
                          ".setVisibility(android.view.View.GONE);\n"
                      )
              else:
                  out.append(line)

          s = "".join(out)

          s = re.sub(
              r'<(?:button|a|div)[^>]*>[^<]*مشاركة التطبيق[^<]*</(?:button|a|div)>',
              '',
              s,
              flags=re.I | re.S
          )

          if s != original:
              f.write_text(s, encoding="utf-8")
              print("Share-app section removed.")
          else:
              print("No share label found.")
          PY
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HABASHY-APK-V19
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
