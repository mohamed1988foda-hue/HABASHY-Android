name: Build HABASHY APK V20

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q HABASHY_Android_Project_V18.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Enable Internet
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest #' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Prepare Online Catalog
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/catalog"

          cat > "$PROJECT_DIR/app/src/main/assets/catalog/online.js" <<'EOF'
          const SUPABASE_URL = "https://tgisywrlmmwlcgqmvjpf.supabase.co";
          const SUPABASE_KEY = "sb_publishable_KTLWxGdoFz702QcSjPkUwQ_r5lLlxEj";

          const habashySupabase =
            window.supabase.createClient(
              SUPABASE_URL,
              SUPABASE_KEY
            );

          function habashyInstallationId() {
            let id = localStorage.getItem("habashy_installation_id");

            if (!id) {
              id = crypto.randomUUID();
              localStorage.setItem(
                "habashy_installation_id",
                id
              );
            }

            return id;
          }

          async function habashyTrack(
            eventType,
            sectionId = null,
            productName = null
          ) {
            try {
              const session =
                await habashySupabase.auth.getSession();

              const userId =
                session.data.session?.user?.id || null;

              await habashySupabase
                .from("analytics_events")
                .insert({
                  user_id: userId,
                  installation_id:
                    habashyInstallationId(),
                  event_type: eventType,
                  section_id: sectionId,
                  product_name: productName
                });

              if (userId) {
                await habashySupabase
                  .from("customer_profiles")
                  .update({
                    last_seen_at:
                      new Date().toISOString()
                  })
                  .eq("id", userId);
              }
            } catch (e) {
              console.log("Analytics error", e);
            }
          }

          habashyTrack("app_open");
          EOF

          if ! grep -q "online.js" "$PROJECT_DIR/app/src/main/assets/catalog/index.html"; then
            sed -i 's#</body>#<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="online.js"></script></body>#' "$PROJECT_DIR/app/src/main/assets/catalog/index.html"
          fi
      - name: Update MainActivity
        run: |
          cat > "$PROJECT_DIR/app/src/main/java/com/habashy/catalog/MainActivity.java" <<'EOF'
          package com.habashy.catalog;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                      Color.rgb(16, 24, 39)
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(true);

                  webView.setBackgroundColor(
                      Color.rgb(245, 246, 248)
                  );

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/catalog/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HABASHY-APK-V20
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
