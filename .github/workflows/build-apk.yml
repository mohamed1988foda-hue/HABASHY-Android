name: Build HABASHY APK V20

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q HABASHY_Android_Project_V18.zip -d extracted

      - name: Locate project      
          SETTINGS=$(find extracted -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f -name "settings.gradle.kts" | head -1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
      - name: Rebuild MainActivity
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/habashy/catalog/MainActivity.java"

          cat > "$FILE" <<'EOF'
          package com.habashy.catalog;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(16, 24, 39));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(245, 246, 248));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/catalog/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

